# Pinned exactly. A build that resolves differently on CI than locally is not a build
# you can ship an auto-update from.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
hilt = "2.60.1"
hiltAndroidx = "1.4.0"
googleServices = "4.5.0"
crashlyticsPlugin = "3.0.8"
baselineprofile = "1.5.0"

composeBom = "2026.09.00"
activity = "1.13.0"
coreKtx = "1.19.1"
coreSplashscreen = "1.2.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
datastore = "1.2.1"
work = "2.12.0"
palette = "1.0.0"
exifinterface = "1.4.2"
profileinstaller = "1.4.1"
