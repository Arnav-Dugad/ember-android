name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      # No secrets here: the release build falls back to debug signing and Preview mode.
      - run: ./gradlew :app:assembleRelease :app:testDebugUnitTest --no-daemon

  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/rules-tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g firebase-tools
      - run: npm ci
      # Boots the Firestore emulator and runs the security rules tests against it.
      - run: npm test
